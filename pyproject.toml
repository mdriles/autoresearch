[project]
name = "autoresearch"
version = "0.1.0"
description = "Autonomous pretraining research swarm"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "kernels>=0.11.7",
    "matplotlib>=3.10.8",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "pyarrow>=21.0.0",
    "requests>=2.32.0",
    "rustbpe>=0.1.0",
    "tiktoken>=0.11.0",
    # torch 2.7.1 is the last release supporting Pascal GPUs (sm_61, GTX 1060).
    # PyPI wheels are built against CUDA 12.6 — no custom index needed.
    "torch==2.7.1",
]
